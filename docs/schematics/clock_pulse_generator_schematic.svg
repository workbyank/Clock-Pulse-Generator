<svg xmlns="http://www.w3.org/2000/svg" width="700" height="530" viewBox="0 0 700 530" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Clock pulse generator schematic</title>
  <desc>A 555 astable clock or a manual push button is selected, passed through an OR gate, and gated by an inverted HLT signal to produce the clock output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#226192" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="530" rx="16" fill="#EAE6DE"/>
  <text x="350" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#226192">Clock pulse generator</text>
  <text x="350" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#226192">Auto 555 clock or manual push button, with HLT stop</text>

  <g transform="translate(0,80)">
    <g stroke="#226192" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
      <line x1="170" y1="68" x2="210" y2="68"/>
      <line x1="330" y1="68" x2="380" y2="68"/>
      <line x1="500" y1="68" x2="530" y2="68"/>
      <path d="M170 178 L270 178 L270 96"/>
      <line x1="100" y1="206" x2="100" y2="260"/>
      <line x1="170" y1="288" x2="380" y2="288"/>
      <path d="M440 260 L440 96"/>
      <path d="M330 388 L355 388 L355 304 L380 304"/>
      <line x1="595" y1="260" x2="595" y2="206"/>
      <line x1="595" y1="150" x2="595" y2="96"/>
    </g>

    <rect x="30" y="40" width="140" height="56" rx="8" fill="#226192"/>
    <text x="100" y="60" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#EAE6DE">555 astable</text>
    <text x="100" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#EAE6DE">1k, 100k, 1µF</text>

    <rect x="210" y="40" width="120" height="56" rx="8" fill="#226192"/>
    <text x="270" y="60" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#EAE6DE">AND gate</text>
    <text x="270" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#EAE6DE">Auto if selected</text>

    <rect x="380" y="40" width="120" height="56" rx="8" fill="#226192"/>
    <text x="440" y="60" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#EAE6DE">OR gate</text>
    <text x="440" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#EAE6DE">Either pulse</text>

    <rect x="530" y="40" width="130" height="56" rx="8" fill="#EF8557"/>
    <text x="595" y="60" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#226192">AND gate</text>
    <text x="595" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#226192">Clock out</text>

    <rect x="30" y="150" width="140" height="56" rx="8" fill="#226192"/>
    <text x="100" y="170" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#EAE6DE">Select switch</text>
    <text x="100" y="190" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#EAE6DE">Auto or manual</text>

    <rect x="530" y="150" width="130" height="56" rx="8" fill="#226192"/>
    <text x="595" y="170" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#EAE6DE">NOT gate</text>
    <text x="595" y="190" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#EAE6DE">Invert HLT</text>

    <rect x="30" y="260" width="140" height="56" rx="8" fill="#226192"/>
    <text x="100" y="280" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#EAE6DE">NOT gate</text>
    <text x="100" y="300" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#EAE6DE">Invert select</text>

    <rect x="380" y="260" width="120" height="56" rx="8" fill="#226192"/>
    <text x="440" y="280" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#EAE6DE">AND gate</text>
    <text x="440" y="300" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#EAE6DE">Manual if not auto</text>

    <rect x="530" y="260" width="130" height="56" rx="8" fill="#226192"/>
    <text x="595" y="280" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#EAE6DE">HLT switch</text>
    <text x="595" y="300" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#EAE6DE">Stop the clock</text>

    <rect x="200" y="360" width="130" height="56" rx="8" fill="#226192"/>
    <text x="265" y="380" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#EAE6DE">Push button</text>
    <text x="265" y="400" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#EAE6DE">One step at a time</text>
  </g>

  <text x="350" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#226192">IC list: 555 (timer) · 74LS08 (AND) · 74LS32 (OR) · 74LS04 (NOT)</text>
</svg>
